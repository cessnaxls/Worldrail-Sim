<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WorldRail Native</title><style>
*{box-sizing:border-box}html,body,#c{width:100%;height:100%;margin:0;overflow:hidden;background:#9fc7df;font-family:system-ui;color:white;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;justify-content:space-between}.pill,.btn{background:#101820d9;border:1px solid #ffffff33;border-radius:12px;padding:9px 12px;backdrop-filter:blur(8px)}
#speed{font-size:30px;font-weight:800}.controls{position:absolute;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end}.lever{pointer-events:auto;width:72px;height:250px;background:#101820d9;border-radius:20px;padding:12px;display:flex;align-items:center;justify-content:center}.lever input{writing-mode:vertical-lr;direction:rtl;width:220px;height:50px}
.buttons{display:grid;grid-template-columns:repeat(2,70px);gap:8px;pointer-events:auto}.btn{text-align:center;font-weight:700;user-select:none}.btn:active{transform:scale(.96)}
#status{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#101820d9;padding:8px 14px;border-radius:10px}
</style></head><body><canvas id=c></canvas><div id=hud><div class=top><div class=pill><b>WORLDRAIL NATIVE V1.1</b><br><span id=mode>Cab camera</span></div><div class=pill><span id=speed>0</span> km/h<br><span id=limit>Limit 90</span></div></div><div id=status>Native simulator • no Hmmsim</div>
<div class=controls><div class=lever><input id=power type=range min=-8 max=5 value=0 step=1></div><div class=buttons><div class=btn id=cam>CAM</div><div class=btn id=horn>HORN</div><div class=btn id=doors>DOORS</div><div class=btn id=reset>RESET</div></div></div></div>
<script src="/babylon.js"></script><script>
const B=BABYLON,canvas=document.getElementById('c'),engine=new B.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:false,antialias:true});
engine.setHardwareScalingLevel(Math.max(1,window.devicePixelRatio/1.5));
const scene=new B.Scene(engine);scene.clearColor=new B.Color4(.58,.76,.87,1);scene.fogMode=B.Scene.FOGMODE_LINEAR;scene.fogStart=180;scene.fogEnd=700;scene.fogColor=new B.Color3(.58,.76,.87);
const sun=new B.DirectionalLight('sun',new B.Vector3(-.5,-1,.35),scene);sun.intensity=1.5;new B.HemisphericLight('sky',new B.Vector3(0,1,0),scene).intensity=.55;
const mat=(n,c)=>{let m=new B.StandardMaterial(n,scene);m.diffuseColor=B.Color3.FromHexString(c);m.specularColor=new B.Color3(.12,.12,.12);return m}
const steel=mat('steel','#6f7475'),dark=mat('rail','#27292a'),wood=mat('ties','#594535'),ballast=mat('ballast','#777775'),grass=mat('grass','#668254'),glass=mat('glass','#24333d'),blue=mat('blue','#27659a'),road=mat('road','#383a3b'),concrete=mat('concrete','#a9aaa6');
function box(n,w,h,d,x,y,z,m){let o=B.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},scene);o.position.set(x,y,z);o.material=m;return o}
const ground=box('ground',900,1,1600,0,-.6,500,grass), roadL=box('road',10,.15,1600,38,.02,500,road);
// Track: two detailed rails, ballast, sleepers.
box('bed',7,.35,1600,0,.05,500,ballast);
box('railL',.075,.14,1600,-.7175,.38,500,dark);box('railR',.075,.14,1600,.7175,.38,500,dark);
for(let z=-250;z<1300;z+=.65)box('tie',2.6,.12,.24,0,.25,z,wood);
// Random scenery, intentionally clear of railway.
let rnd=1234567;function R(){rnd=(rnd*1664525+1013904223)>>>0;return rnd/4294967296}
for(let z=-180;z<1250;z+=14+R()*18){let side=R()<.5?-1:1,x=side*(15+R()*55);if(R()<.58){let trunk=B.MeshBuilder.CreateCylinder('tree',{height:4+R()*4,diameter:.5},scene);trunk.position.set(x,2,z);trunk.material=wood;let crown=B.MeshBuilder.CreateSphere('crown',{diameter:4+R()*4,segments:8},scene);crown.position.set(x,5,z);crown.material=grass}else{let w=7+R()*15,h=5+R()*14,d=8+R()*16;box('building',w,h,d,x,h/2,z, R()<.5?concrete:wood)}}
// stations
for(const z of [100,520,980]){box('platform',5,.7,120,-5,0.5,z,concrete);box('platform2',5,.7,120,5,0.5,z,concrete);for(let q=-50;q<=50;q+=25){box('lamp',.15,4,.15,-3.2,2.5,z+q,dark);box('lamp',.15,4,.15,3.2,2.5,z+q,dark)}}
// train
const train=new B.TransformNode('train',scene);function tbox(n,w,h,d,x,y,z,m){let o=box(n,w,h,d,x,y,z,m);o.parent=train;return o}
for(let car=0;car<4;car++){let z=-car*20;tbox('body',2.9,3.5,18.8,0,2.3,z,steel);tbox('window',2.92,1,12,0,2.8,z,glass);for(let side of [-1,1])for(let dz of [-5,0,5])tbox('door',.06,2.3,1.4,side*1.48,2,z+dz,blue);for(let bz of [-6,6]){for(let x of [-.8,.8]){let wh=B.MeshBuilder.CreateCylinder('wheel',{diameter:.8,height:.16,tessellation:16},scene);wh.rotation.z=Math.PI/2;wh.position.set(x,.65,z+bz);wh.parent=train;wh.material=dark}}}
train.position.z=0;
let camMode=0;const cam=new B.FreeCamera('cam',new B.Vector3(0,3.1,7),scene);cam.minZ=.1;scene.activeCamera=cam;
let v=0,lever=0,doors=false,limit=90,last=performance.now();
function updateCam(){if(camMode===0){cam.position.set(train.position.x,3.1,train.position.z+7);cam.setTarget(new B.Vector3(0,2.4,train.position.z+80));document.getElementById('mode').textContent='Cab camera'}
else if(camMode===1){cam.position.set(10,5,train.position.z-18);cam.setTarget(new B.Vector3(0,2,train.position.z));document.getElementById('mode').textContent='External camera'}
else{cam.position.set(-14,3,train.position.z+35);cam.setTarget(new B.Vector3(0,2,train.position.z));document.getElementById('mode').textContent='Trackside camera'}}
document.getElementById('power').oninput=e=>lever=+e.target.value;
document.getElementById('cam').onclick=()=>camMode=(camMode+1)%3;document.getElementById('doors').onclick=()=>doors=!doors;
document.getElementById('reset').onclick=()=>{train.position.z=0;v=0;lever=0;document.getElementById('power').value=0};
document.getElementById('horn').onclick=()=>{try{new Audio('/assets/sounds/horn.wav').play()}catch(e){}};
engine.runRenderLoop(()=>{let now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;
let ms=v/3.6,tractive=lever>0?lever*.22:0,brake=lever<0?-lever*.55:0,res=.018+.00032*v;
let a=tractive-brake-res;if(doors)a=Math.min(a,-1.2);ms=Math.max(0,ms+a*dt);v=ms*3.6;train.position.z+=ms*dt;if(train.position.z>1250)train.position.z=-200;
limit=train.position.z>430&&train.position.z<610?60:90;document.getElementById('speed').textContent=Math.round(v);document.getElementById('limit').textContent='Limit '+limit;updateCam();scene.render()});
window.addEventListener('resize',()=>engine.resize());
</script></body></html>
