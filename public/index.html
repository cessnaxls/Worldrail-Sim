<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WorldRail Generator</title><link rel="stylesheet" href="style.css"></head><body><header><b>WORLDRAIL</b><span>AI Network Studio • 520-object starter library</span></header><main><section id="map"><canvas id="c"></canvas><div class="hint">Tap map to place network center</div></section><aside><h2>Generate network</h2><label>Radius <output id="rv">5 mi</output></label><input id="r" type="range" min="1" max="30" value="5"><label>Track arrangement</label><select id="tracks"><option>Single track</option><option selected>Double / parallel</option><option>Four-track trunk</option></select><label>Alignment</label><select id="mode"><option>Above ground</option><option>Subway</option><option>Mixed</option></select><label><input type="checkbox" id="real"> Trace real-life railway corridors</label><label><input type="checkbox" checked> Census + activity station planning</label><button id="gen">GENERATE NETWORK</button><div id="status">Place a center point.</div><hr><h3>Train builder</h3><select><option>Electric metro preset</option><option>Diesel regional preset</option><option>High-speed EMU preset</option><option>Custom consist…</option></select><div class="grid"><button>Cab</button><button>Timetable</button><button>Signals</button><button>AI traffic</button><button>Assets</button><button>Drive</button></div><h3>Asset library</h3><div id="assets"></div></aside></main><script src="app.js"></script></body></html>
