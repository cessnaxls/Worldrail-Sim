<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b0e12">
  <title>WorldRail Generator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3yns4MZ3JpPZ7S0j8VQXPCbT2Q==" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><b>WORLDRAIL</b><span>AI Network Studio • 520-object starter library</span></header>
<main>
  <section id="mapWrap">
    <div id="map"></div>
    <div class="hint">Tap the map to place the network center</div>
    <div class="maptools">
      <button id="locate" title="Use my location">◎ Locate</button>
      <button id="home" title="Return to starting view">⌂ Home</button>
    </div>
  </section>
  <aside>
    <h2>Generate network</h2>
    <label>Radius <output id="rv">5 mi</output></label>
    <input id="r" type="range" min="1" max="30" value="5">
    <label>Track arrangement</label>
    <select id="tracks"><option>Single track</option><option selected>Double / parallel</option><option>Four-track trunk</option></select>
    <label>Alignment</label>
    <select id="mode"><option>Above ground</option><option>Subway</option><option>Mixed</option></select>
    <label class="check"><input type="checkbox" id="real"> Trace real-life railway corridors</label>
    <label class="check"><input type="checkbox" id="planning" checked> Census + activity station planning</label>
    <button id="gen">GENERATE NETWORK</button>
    <div id="status">Tap the map to place a center point.</div>
    <hr>
    <h3>Train builder</h3>
    <select id="trainPreset"><option>Electric metro preset</option><option>Diesel regional preset</option><option>High-speed EMU preset</option><option>Custom consist…</option></select>
    <div class="grid"><button>Cab</button><button>Timetable</button><button>Signals</button><button>AI traffic</button><button>Assets</button><button>Drive</button></div>
    <h3>Asset library</h3><div id="assets"></div>
  </aside>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="app.js"></script>
</body>
</html>
